<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mon expérience - CinéFilm</title>

    <!-- Police -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="style.css">

    <!-- JavaScript -->
    <script src="experience.js" defer></script>
</head>

<body class="page-experience">

    <!-- MENU -->
    <header>
        <nav class="navbar">

            <h2 class="logo">CINÉFILM</h2>

            <ul>
                <li><a href="index.html">Accueil</a></li>
                <li><a href="film.html">Films</a></li>
                <li><a href="Decouvrir.html">Découvrir</a></li>
                <li><a href="experience.html">Mon expérience</a></li>
                <li><a href="a-propos.html">À propos</a></li>
            </ul>

        </nav>
    </header>

    <main>

        <!-- PRESENTATION -->
        <section class="intro-experience">

            <h1>Mon expérience cinéma</h1>

            <p>
                Tu as regardé un film ?
                Partage ce que tu en as pensé et ce que tu as retenu de l'histoire.
            </p>

        </section>

        <!-- FORMULAIRE -->
        <section class="bloc-experience">

            <h2>Donne ton avis</h2>

            <form id="form-experience">

                <!-- FILM -->
                <label for="film-choisi">
                    Quel film as-tu regardé ?
                </label>

                <select id="film-choisi" required>

                    <option value="">Choisir un film</option>

                    <option value="Selma">Selma</option>

                    <option value="Tu ne tueras point">
                        Tu ne tueras point
                    </option>

                    <option value="Les Suffragettes">
                        Les Suffragettes
                    </option>

                    <option value="Les Figures de l'ombre">
                        Les Figures de l'ombre
                    </option>

                </select>

                <!-- RESSENTI -->
                <label for="ressenti">
                    Qu'est-ce que tu as retenu du film ?
                </label>

                <select id="ressenti" required>

                    <option value="">Choisir une réponse</option>

                    <option value="J'ai appris quelque chose">
                        J'ai appris quelque chose
                    </option>

                    <option value="J'ai envie d'en savoir plus">
                        J'ai envie d'en savoir plus
                    </option>

                </select>

                <!-- COMMENTAIRE -->
                <label for="avis-film">
                    Tu veux ajouter quelque chose ?
                </label>

                <textarea id="avis-film"
                          rows="5"
                          maxlength="500"
                          placeholder="Écris ton avis ici..."></textarea>

                <button type="submit">
                    Enregistrer
                </button>

                <p id="message-experience"></p>

            </form>

        </section>

        <!-- AVIS ENREGISTRES -->
        <section class="mes-avis">

            <h2>Mes avis</h2>

            <div id="liste-experiences"></div>

        </section>

    </main>

    <!-- FOOTER -->
    <footer>
        <p>© 2026 - CinéFilm | Selma Belladjou</p>
    </footer>

</body>
</html>
